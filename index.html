<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Call Bridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a real card table seen from your chair. Wooden plank table fills the screen; opponents hold fanned card backs at the
   top and both sides with a small name tag; tricks land face up in the middle; your hand fans along the bottom edge.
   Scores are kept on a ruled paper pad, the way people keep them at home. Single deliberate (warm, dark-wood) look. */
:root{
  --wood:#7a4a26; --wood-dark:#2a170b; --ink:#fff4e2; --muted:#e6cfae;
  --tag:rgba(24,13,6,.78); --tag-line:rgba(255,232,200,.18);
  --gold:#f2c14e; --gold-ink:#2a1a04; --won:#3fae62; --call:#3b3b44;
  --paper:#fbf8ef; --rule:rgba(70,120,190,.28); --margin:rgba(214,60,60,.55); --pen:#1d2a5c; --pen-red:#c4231b; --pen-green:#1d7a3e;
  --f-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Kalam","Hind Siliguri",cursive;
  --f-card:Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);background-color:var(--wood);background-size:cover;background-position:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-sizing:border-box}

.bar{display:flex;align-items:center;gap:10px;flex:none;padding:8px 0 8px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(20,10,4,.72),rgba(20,10,4,.0))}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .bn{font-weight:700;font-size:21px;color:var(--ink);text-shadow:0 2px 3px rgba(0,0,0,.6)}
.brand .en{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}
.meta{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.meta .round{font-weight:700;font-size:14.5px}
.meta .code{white-space:nowrap;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em;background:none;border:0;padding:0}
.act{display:flex;gap:6px}
.tb{background:var(--tag);border:1px solid var(--tag-line);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600}

/* table */
.table{flex:1;position:relative;min-height:0;overflow:hidden}
.opp{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px}
.opp.top{left:50%;top:0;transform:translateX(-50%)}
.opp.left{left:max(10px,env(safe-area-inset-left,0px));top:33%;transform:translateY(-50%);flex-direction:column-reverse;align-items:flex-start}
.opp.right{right:max(10px,env(safe-area-inset-right,0px));top:33%;transform:translateY(-50%);flex-direction:column-reverse;align-items:flex-end}
.fan{position:relative;width:120px;height:62px}
.opp.left .fan{transform:rotate(90deg)} .opp.right .fan{transform:rotate(-90deg)}
.opp.top .fan{transform:rotate(180deg);margin-top:-8px}
.fan .back{position:absolute;left:50%;bottom:0;margin-left:-15px;width:30px;height:42px;transform-origin:50% 120%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.fan .back svg{width:100%;height:100%;display:block}
.opp.left .fan{margin:22px 0 20px -38px} .opp.right .fan{margin:22px -38px 20px 0}
.chip{display:flex;align-items:center;gap:7px;background:var(--tag);border:1px solid var(--tag-line);border-radius:10px;padding:4px 6px 4px 8px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:box-shadow .2s,border-color .2s}
.chip .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.chip .d{font-size:9.5px;font-weight:700;background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 4px;line-height:15px}
.score{display:flex;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;border-radius:5px;overflow:hidden;line-height:20px}
.score .w{background:var(--won);color:#fff;padding:0 6px;min-width:10px;text-align:center}
.score .c{background:var(--call);color:#fff;padding:0 6px;min-width:10px;text-align:center}
.score.over .w{background:#c0392b}
.chip .pt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.45),0 0 16px rgba(242,193,78,.4)}
.think{font-size:11.5px;color:var(--ink);text-shadow:0 1px 2px #000;height:15px;font-style:italic}

.well{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(280px,68%);aspect-ratio:1/1;--cw:66px}
.well .slot{position:absolute}
.well .p0{left:50%;bottom:0;transform:translateX(-50%)}
.well .p2{left:50%;top:0;transform:translateX(-50%)}
.well .p1{right:0;top:50%;transform:translateY(-50%)}
.well .p3{left:0;top:50%;transform:translateY(-50%)}
.well .card{position:relative}
.well .card.win{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.well .note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:600;color:var(--ink);text-shadow:0 1px 3px #000;padding:20%}

.me{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:6px;display:flex;align-items:center;gap:10px}
.status{flex:1;margin:0;font-size:13.5px;line-height:1.3;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.85);font-weight:500}
.status em{font-style:normal;color:var(--gold);font-weight:700}

/* call panel */
.callpanel{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(310px,calc(100% - 120px));min-width:250px;background:rgba(22,12,5,.9);border:1px solid var(--tag-line);border-radius:16px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:5;box-sizing:border-box}
.callpanel h2{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.callpanel .sub{margin:2px 0 10px;font-size:12px;color:var(--muted);line-height:1.35}
.callpanel .sub b{color:var(--gold)}
.callgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.callgrid button{height:38px;border-radius:9px;background:#3a2414;border:1px solid rgba(255,232,200,.22);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;position:relative}
.callgrid button.sug{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.callgrid button .b{position:absolute;top:0;right:3px;font-size:8.5px;color:var(--gold);font-weight:600}
.callgrid button.sug .b{color:var(--gold-ink)}
.callgrid button:active{transform:scale(.95)}

/* cards */
.card{position:absolute;box-sizing:border-box;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.08);padding:0;border:0;background:none;
  box-shadow:0 2px 4px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.25);transition:transform .16s ease}
.card svg{width:100%;height:100%;display:block}
.hand{position:relative;flex:none;--cw:66px;height:calc(var(--cw)*1.4 + 14px);margin-top:-6px;padding-bottom:0}
.hand .card{bottom:-10px}
.hand .card.legal{transform:translateY(-16px)}
.hand .card.dim::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(20,10,4,.38)}
.hand .card:disabled{cursor:default}
.hand.myturn .card.legal:hover{transform:translateY(-22px)}

.bubble{position:fixed;z-index:25;transform:translate(-50%,-100%);background:#fff;color:#1b1206;font-weight:700;font-size:14px;padding:3px 10px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.gold{background:var(--gold)} .bubble.gold::after{border-top-color:var(--gold)}
.bubble.good{background:#7fe0a0} .bubble.good::after{border-top-color:#7fe0a0}
.bubble.bad{background:#ff9b8e} .bubble.bad::after{border-top-color:#ff9b8e}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);background:var(--tag);border:1px solid var(--tag-line);font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* score pad */
.modal{position:fixed;inset:0;background:rgba(10,5,2,.62);display:grid;place-items:center;z-index:40;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet{position:relative;width:100%;max-width:400px;max-height:84vh;overflow:auto;box-sizing:border-box;color:var(--pen);
  background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 0,0 14px;
  border-radius:4px;padding:20px 16px 16px 52px;box-shadow:0 2px 0 #e9e2cf,0 4px 0 #ddd4bd,0 20px 50px rgba(0,0,0,.55);transform:rotate(-.6deg)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:radial-gradient(circle at 8px 6px,#3a2a1a 0 3px,transparent 3.5px) 0 0/22px 12px repeat-x;opacity:.55}
.sheet h2{margin:0 0 2px;font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1.1;color:var(--pen)}
.sheet .lede{margin:0 0 10px;font-family:var(--f-hand);font-size:15px;color:#4a5680;line-height:32px}
.pad{width:100%;border-collapse:collapse;font-family:var(--f-hand);font-size:18px;font-variant-numeric:tabular-nums}
.pad th{font-family:var(--f-body);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6a7398;font-weight:700;text-align:right;padding:0 4px;height:32px}
.pad th:first-child,.pad td:first-child{text-align:left}
.pad td{height:32px;padding:0 4px;text-align:right;line-height:1}
.pad .ok{color:var(--pen-green);font-weight:700} .pad .no{color:var(--pen-red);font-weight:700}
.pad .mark{font-size:15px;margin-left:4px}
.pad tr.total td{font-weight:700;font-size:21px;border-top:2px solid var(--pen)}
.pad td.lead span{display:inline-block;border:2px solid var(--pen-red);border-radius:50%;padding:0 7px;transform:rotate(-4deg)}
.winline{font-family:var(--f-hand);font-size:24px;font-weight:700;color:var(--pen-red);margin:0 0 6px;line-height:32px}
.winline span{border:2.5px solid var(--pen-red);border-radius:50% / 60%;padding:0 12px;display:inline-block;transform:rotate(-3deg)}
.sheet .row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.25);background:#efe8d6;color:#2a1a0a;font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.primary{background:#6b3c1c;color:#fff4e2;border-color:#4a2810}
.btn:active{transform:translateY(1px)}
.rules{font-family:var(--f-body)}
.rules ol{margin:0;padding-left:18px;font-size:14px;line-height:32px;color:#232a45}
.rules h3{font-family:var(--f-hand);font-size:20px;margin:6px 0 0;line-height:32px;color:var(--pen-red)}
.rules p.note{margin:0;font-size:14px;line-height:32px;color:#3a4366}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:#232a45;line-height:32px}
.switch input{width:20px;height:20px;accent-color:#6b3c1c}


/* ---- rickshaw-painted touches ---- */
.bar{position:relative}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:5px;
  background:radial-gradient(circle,#fff6dc 0 1.2px,transparent 1.6px) 0 50%/8px 5px repeat-x,
  repeating-linear-gradient(90deg,#d01f4c 0 16px,#f2c14e 16px 32px,#0e7a5a 32px 48px,#1f45b0 48px 64px);
  box-shadow:0 2px 4px rgba(0,0,0,.4);opacity:.92}
.medal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(340px,92%);aspect-ratio:1/1;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.medal svg{width:100%;height:100%;display:block}

.sheet{box-shadow:0 0 0 5px #f2c14e,0 0 0 9px #d01f4c,0 0 0 12px #0e7a5a,0 0 0 15px #f2c14e,0 0 0 16px #1b130c,0 22px 50px rgba(0,0,0,.6);
  outline:2.5px dotted #fff6dc;outline-offset:5.5px}
.modal{padding:32px 30px}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;

<script>
(() => {
  const SUITS = ['S','H','C','D'];
  const RN = {11:'J',12:'Q',13:'K',14:'A'};
  const MAX_ROUNDS = 5;
  const $ = id => document.getElementById(id);
  const key = c => c.s + c.r;
  const rName = r => RN[r] || String(r);


  // ---------- sound: every effect is synthesised with Web Audio, no audio files ----------
  const SFX = (()=>{
    let ctx=null, on=true, noiseBuf=null;
    try{ on = localStorage.getItem('cb-sound')!=='off'; }catch(e){}
    function ac(){
      if (!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
      if (ctx.state==='suspended') ctx.resume();
      return ctx;
    }
    function noise(){
      if (noiseBuf) return noiseBuf;
      const n=ctx.sampleRate*.5; noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for (let i=0;i<n;i++) d[i]=Math.random()*2-1;
      return noiseBuf;
    }
    // short filtered noise burst: card snaps, riffles, swishes
    function burst(t, dur, freq, q, vol, sweepTo){
      const s=ctx.createBufferSource(); s.buffer=noise();
      const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t+dur);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(f).connect(g).connect(ctx.destination); s.start(t, Math.random()*.4); s.stop(t+dur+.02);
    }
    // noise through a low-pass (and optional high-pass), with its own envelope: soft, papery card sounds
    function soft(t, dur, lp, vol, lpTo, hp, attack){
      const s=ctx.createBufferSource(); s.buffer=noise();
      const l=ctx.createBiquadFilter(); l.type='lowpass'; l.frequency.setValueAtTime(lp,t); l.Q.value=.7;
      if (lpTo) l.frequency.exponentialRampToValueAtTime(lpTo, t+dur);
      const hpF=ctx.createBiquadFilter(); hpF.type='highpass'; hpF.frequency.value=hp||180;
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+(attack||.003)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(l).connect(hpF).connect(g).connect(ctx.destination); s.start(t, Math.random()*.4); s.stop(t+dur+.02);
    }
    // short pitched knock: the table answering the card
    function knock(t, f0, f1, dur, vol){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.002); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+.02);
    }

    const cols=['#e8357c','#1d9e6e','#f2b01e','#2f5ed0'];
    for(let i=0;i<24;i++){ const a=i*15, r=a*Math.PI/180, x=C+Math.sin(r)*78, y=C-Math.cos(r)*78;
      s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5.6" ry="10.5" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${cols[i%4]}" stroke="${O}" stroke-width=".9"/>`;
      const x2=C+Math.sin(r+.13)*86, y2=C-Math.cos(r+.13)*86; s+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.6" fill="#f2c14e"/>`; }
    s+=`<circle cx="${C}" cy="${C}" r="67" fill="#0b5345" stroke="#f2c14e" stroke-width="2.4"/>`;
    for(let i=0;i<32;i++){ const a0=i*11.25*Math.PI/180, a1=(i*11.25+5.6)*Math.PI/180;
      s+=`<path d="M${C} ${C}L${(C+Math.sin(a0)*65).toFixed(1)} ${(C-Math.cos(a0)*65).toFixed(1)}A65 65 0 0 1 ${(C+Math.sin(a1)*65).toFixed(1)} ${(C-Math.cos(a1)*65).toFixed(1)}Z" fill="#0f6a57"/>`; }
    s+=`<circle cx="${C}" cy="${C}" r="56" fill="none" stroke="#f2c14e" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
    for(let i=0;i<8;i++){ const r=(i*45+22.5)*Math.PI/180, x=C+Math.sin(r)*61, y=C-Math.cos(r)*61;
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${cols[i%4]}" stroke="${O}" stroke-width=".6"/>`; }
    for(let i=0;i<8;i++){ const a=i*45; s+=`<ellipse cx="${C}" cy="${C-11}" rx="5" ry="10" transform="rotate(${a} ${C} ${C})" fill="#f2c14e" opacity=".14"/>`; }
    s+=`<text x="${C}" y="${C+46}" text-anchor="middle" font-family="Hind Siliguri,sans-serif" font-weight="700" font-size="11" fill="#f2c14e" opacity=".55" letter-spacing="1">কল ব্রিজ</text>`;
    s+=`<circle cx="${C}" cy="${C}" r="97" fill="url(#mgloss)"/></svg>`;
    const d=document.createElement('div'); d.className='medal'; d.innerHTML=s;
    const t=document.querySelector('.table'); t.insertBefore(d, t.firstChild);
  })();

  // ---------- UI ----------
  function cardEl(c, tag){
    const el=document.createElement(tag||'div');
    el.className='card'; el.innerHTML=cardSVG(c);
    el.setAttribute('aria-label', `${rName(c.r)} of ${{S:'spades',H:'hearts',C:'clubs',D:'diamonds'}[c.s]}`);
    return el;
  }
  function chipHTML(p){
    const c=G.calls[p], w=G.won[p];
    const over = c!=null && G.phase==='playing' && w>c+1;
    const sc = `<span class="score${over?' over':''}" title="${t('wonCall')}"><span class="w">${n(w)}</span><span class="c">${c==null?'–':n(c)}</span></span>`;
    const turn = G.turn===p && (G.phase==='calling'||G.phase==='playing');
    return `<div class="chip${turn?' turn':''}" id="chip${p}"><span class="nm">${nm(p)}${G.dealer===p?`<span class="d" title="${t('dealerT')}">${t('dealer')}</span>`:''}</span>${sc}<span class="pt">${n(G.scores[p])}</span></div>`;
  }
  function fanHTML(p){
    // Real held hand: cards pivot around a point just off the table edge, so they spread wide like a fan.
    const n=G.hands[p].length; if (!n) return '';
    const base={1:-90,2:180,3:90}[p], spread=Math.min(96, 8+n*7), step=n>1?spread/(n-1):0;
    let s='';
    for (let i=0;i<n;i++) s+=`<div class="back" style="transform:rotate(${(base-spread/2+i*step).toFixed(1)}deg)">${BACK_SVG}</div>`;
    return s;
  }
  function fanCenter(p){ const f=$('fan'+p), k=f.children; return center(k.length ? k[k.length>>1] : f); }
  function render(){
    $('roundLbl').innerHTML=t('round',G.round,MAX_ROUNDS);
    $('dealCode').textContent=t('deal',seedCode(G.seed));
    for (const p of [1,2,3]){
      const turn = G.turn===p && (G.phase==='calling'||G.phase==='playing');
      const think = turn ? (G.phase==='calling'?t('calling'):t('thinking')) : '';
      $('fan'+p).innerHTML = fanHTML(p);
      $('seat'+p).innerHTML = chipHTML(p) + `<span class="think">${think}</span>`;
    }
    $('seat0').innerHTML = `<div class="mine">${chipHTML(0)}<div class="tbar" id="tbar" hidden><i></i></div></div>` + `<p class="status" id="status" aria-live="polite"></p>`;
    paintTimer();
    const well=$('well'); well.innerHTML='';
    if (!G.trick.length && G.phase==='calling' && G.turn!==0){
      const n=document.createElement('div'); n.className='note'; n.textContent=t('isCalling',nm(G.turn)); well.appendChild(n);
    }
    G.trick.forEach((t,i)=>{
      const slot=document.createElement('div'); slot.className='slot p'+t.p;
      const el=cardEl(t.c); if (G.winMark===t.p) el.classList.add('win');
      t.tilt ??= (Math.random()*10-5).toFixed(1);
      el.style.rotate=t.tilt+'deg';
      slot.appendChild(el); well.appendChild(slot);
      if (i===G.trick.length-1 && G.fly){
        const from=G.fly, to=center(el); G.fly=null;
        anim(el,[{transform:`translate(${from.x-to.x}px,${from.y-to.y}px) scale(${t.p===0?1.05:.5})`,opacity:t.p===0?1:.5},{transform:'none',opacity:1}],
          {duration:340,easing:'cubic-bezier(.2,.8,.25,1)'});
      }
    });
    if (G.winMark!=null){
      const wel=well.querySelector('.card.win');
      if (wel) setTimeout(()=>anim(wel,[{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:400,easing:'ease-out'}),360);
    }
    renderHand(); renderStatus();
    if (G.dealAnim) dealAnimation();
  }
  function renderStatus(){
    const st=$('status'); if (!st) return;
    if (G.phase==='calling'){ st.innerHTML = G.turn===0 ? t('myCall') : t('isCalling',nm(G.turn)); return; }
    if (G.phase==='playing'){
      if (G.winMark!=null){ st.innerHTML = G.winMark===0 ? t('youWon') : t('heWon',nm(G.winMark)); return; }
      if (G.turn===0){
        const need=G.calls[0]-G.won[0];
        const c0=G.calls[0];
        let tip = need>0 ? t('need',need,c0,c0>=8?13:c0) : need===0 ? t('made',c0) : need===-1 ? t('careful',c0) : t('tooMany',c0);
        if (G.trickNo===0 && !G.trick.length) tip += ' · '+t('noSpade');
        st.innerHTML=`${t('yourTurn')} · ${tip}`;
      } else st.textContent=t('isPlaying',nm(G.turn));
      return;
    }
    st.textContent=t('roundOver');
  }
  function renderHand(){
    const box=$('hand'); box.innerHTML='';
    const hand=G.hands[0], n=hand.length; if (!n){ box.classList.remove('myturn'); return; }
    const W=box.clientWidth || 360;
    const cw=Math.round(Math.min(78, Math.max(54, W/5.6)));
    box.style.setProperty('--cw', cw+'px');
    const pad=16, step = n>1 ? Math.min(cw*.62, (W-2*pad-cw)/(n-1)) : 0;
    const start=(W-(cw+step*(n-1)))/2;
    const mine = G.phase==='playing' && G.turn===0;
    const legal = mine ? new Set(legalMoves(0).map(key)) : null;
    box.classList.toggle('myturn', mine);
    hand.forEach((c,i)=>{
      const el=cardEl(c,'button'); el.type='button'; el.style.left=(start+i*step)+'px';
      const d=i-(n-1)/2; el.style.rotate=(d*1.1).toFixed(1)+'deg'; el.style.translate=`0 ${(d*d*.22).toFixed(1)}px`;
      if (mine){
        if (legal.has(key(c))){ el.classList.add('legal'); el.addEventListener('click',()=>{ if (G.turn===0){ G.turn=-1; playCard(0,c,el); } }); }
        else { el.classList.add('dim'); el.disabled=true; }
      } else el.disabled=true;
      box.appendChild(el);
    });
  }

        {duration:440,delay:i*45,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'});
    });
    [1,2,3].forEach(p=>{
      [...$('fan'+p).children].forEach((b,i)=>{
        anim(b,[{opacity:0,translate:'0 30px'},{opacity:1,translate:'0 0'}],{duration:300,delay:i*45+p*15,easing:'ease-out',fill:'backwards'});
      });
    });
  }

      scEx:'স্কোরের উদাহরণ', langH:'ভাষা',
      fairH:'ন্যায্য শাফল', fairP:'প্রতিটা ডিল উপরের কোড থেকে আসে। একই কোডে সবসময় একই কার্ড আসে।',
      balH:'ব্যালান্সড ডিল', balP:'প্রত্যেকের হাতে ২–৫টা স্পেড, বড় কার্ডের ন্যায্য ভাগ আর সব রঙের কার্ড থাকে।', balSw:'ব্যালান্সড ডিল (পরের রাউন্ড থেকে)',
      tmH:'টার্ন টাইমার', tmP:'প্রতি চালে ৩০ সেকেন্ড। সময় শেষ হলে আপনার হয়ে ভালো একটা কার্ড বা কল বেছে দেওয়া হয়।', tmSw:'৩০ সেকেন্ডের টার্ন টাইমার'
    }
  };
  const t = (k, ...a) => { const v=L[LANG][k]; return typeof v==='function' ? v(...a) : v; };
  const nm = p => L[LANG].names[p];
  function langSwitch(){
    return `<div class="langsw" role="group" aria-label="Language"><button type="button" data-l="bn" class="${LANG==='bn'?'on':''}">বাংলা</button><button type="button" data-l="en" class="${LANG==='en'?'on':''}">English</button></div>`;
  }
  function wireLang(after){
    document.querySelectorAll('.langsw button').forEach(b=>b.onclick=()=>{ setLang(b.dataset.l); if (after) after(); });
  }
  function paintStatic(){
    document.documentElement.lang = LANG;
    $('btnScores').textContent=t('scores'); $('btnRules').textContent=t('rules'); $('callTitle').textContent=t('yourCall');
    $('dealCode').title = LANG==='bn'?'ন্যায্য শাফল কোড':'Fair shuffle code';
    if (!G.hands){ $('roundLbl').innerHTML=t('round',1,MAX_ROUNDS); $('dealCode').textContent=t('deal','----'); }
    grid.querySelectorAll('button').forEach(b=>{ const v=+b.dataset.v; b.innerHTML = v>=8 ? `${n(v)}<span class="b">${n(13)}</span>` : n(v); });
    if (typeof paintSnd==='function') paintSnd();
  }
  function setLang(l){
    LANG=l; try{ localStorage.setItem('cb-lang', l); }catch(e){}
    paintStatic();
    if (G.hands){ render(); if (!$('callPanel').hidden) showCallPanel(true); }
  }

  function showCallPanel(redraw){
    if (!redraw){ SFX.turn(); startTimer(); }
    const sug=estimateCall(G.hands[0]);
    $('callSub').innerHTML=`${t('callSub',sug,sug>=8?13:sug)} <button type="button" class="howlink" id="howBtn">${t('howLink')}</button>`;
    $('howBtn').onclick=()=>showScoring();
    grid.querySelectorAll('button').forEach(b=>b.classList.toggle('sug', +b.dataset.v===sug));
    $('callPanel').hidden=false;
  }

  const fmt = v => (v>0?'+':'')+n(v);
  let tt;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1400); }

  function openModal(html){ if (T.running){ pauseTimer(); T.byModal=true; } $('sheet').innerHTML=html; $('modal').hidden=false; $('sheet').scrollTop=0; }
  function closeModal(){ $('modal').hidden=true; if (T.byModal){ T.byModal=false; resumeTimer(); } }
  $('modal').addEventListener('click',e=>{ if (e.target.id==='modal' && G.phase!=='between' && G.phase!=='intro') closeModal(); });

  function winnersOf(){
    const best=Math.max(...G.scores);
    let top=[0,1,2,3].filter(p=>G.scores[p]===best);
    if (top.length>1){ const m=Math.max(...top.map(p=>G.made[p])); top=top.filter(p=>G.made[p]===m); }
    return top;
  }
  function showRoundSummary(){
    const h=G.history[G.history.length-1], final=G.round>=MAX_ROUNDS;
    const rows=[0,1,2,3].map(p=>{
      const ok=h.pts[p]>0;
      const c=h.calls[p], w=h.won[p];
      const why = w<c ? t('short',c-w) : w===c ? (c>=8?t('bigMade'):t('exact')) : w===c+1 ? t('oneExtra') : t('extra',w-c);
      return `<tr><td class="who">${nm(p)}<span class="mark ${ok?'ok':'no'}">${ok?'✓':'✗'}</span><span class="why">${why}</span></td><td>${n(c)}</td><td>${n(w)}</td><td class="${ok?'ok':'no'}">${fmt(h.pts[p])}</td><td>${n(G.scores[p])}</td></tr>`;
    }).join('');
    let head=`<h2>${t('roundH',G.round)}</h2><p class="lede">${t('deal',h.code)}</p>`;
    if (final){
      const top=winnersOf();
      const label = top.map(p=>nm(p)).join(t('and'));
      head=`<h2>${t('finalH')}</h2><p class="winline">${t('winner')} <span>${label}</span></p>`;
    }
    openModal(`${head}<table class="pad"><thead><tr><th>${t('thPlayer')}</th><th>${t('thCall')}</th><th>${t('thWon')}</th><th>${t('thRound')}</th><th>${t('thTotal')}</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="legend">${t('legend')}</p>
      <div class="row"><button class="btn" type="button" id="mScores">${t('allRounds')}</button><button class="btn primary" type="button" id="mNext">${final?t('playAgain'):t('nextRound')}</button></div>`);
    $('mNext').onclick=nextRound; $('mScores').onclick=()=>showScores(true);
  }
  function showScores(fromSummary){
    const best=Math.max(...G.scores), started=G.history.length>0;
    const rows=G.history.map((h,i)=>`<tr><td>${t('padRow',i+1)}</td>${h.pts.map(v=>`<td class="${v>0?'ok':'no'}">${fmt(v)}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="5" style="text-align:left">${t('noRounds')}</td></tr>`;
    openModal(`<h2>${t('padH')}</h2><p class="lede">${t('padSub',G.round,MAX_ROUNDS)}</p>
      <table class="pad"><thead><tr><th></th>${[0,1,2,3].map(p=>`<th>${nm(p)}</th>`).join('')}</tr></thead><tbody>${rows}
      <tr class="total"><td>${t('total')}</td>${G.scores.map(s=>`<td class="${started&&s===best?'lead':''}"><span>${n(s)}</span></td>`).join('')}</tr></tbody></table>
      <div class="row"><button class="btn" type="button" id="mNew">${t('newGame')}</button><button class="btn primary" type="button" id="mBack">${fromSummary?t('back'):t('close')}</button></div>`);
    $('mBack').onclick = fromSummary ? showRoundSummary : closeModal;
    $('mNew').onclick = newGame;
  }
  function showScoring(then){
    const ex=[[3,2,-3],[3,3,3],[3,4,3],[3,5,-3],[8,8,13]], why=t('scWhy');
    openModal(`<div class="rules">${then?langSwitch():''}<h2>${t('scH')}</h2><p class="lede">${t('scSub')}</p>
      <table class="pad"><thead><tr><th>${t('thCall')}</th><th>${t('thWon')}</th><th>${t('thPoints')}</th><th>${t('thWhy')}</th></tr></thead><tbody>
      ${ex.map(([c,w,pt],i)=>`<tr><td>${n(c)}</td><td>${n(w)}</td><td class="${pt>0?'ok':'no'}">${fmt(pt)}</td><td>${why[i]}</td></tr>`).join('')}</tbody></table>
      <p class="note">${t('scNote')}</p>
      <div class="row"><button class="btn primary" type="button" id="mGo">${then?t('letsPlay'):t('gotIt')}</button></div></div>`);
    wireLang(()=>showScoring(then));
    $('mGo').onclick=()=>{ closeModal(); try{ localStorage.setItem('cb-scoring','seen'); }catch(e){} if (then) then(); };
  }
  function showRules(){
    openModal(`<div class="rules">${langSwitch()}<h2>${t('ruH')}</h2><p class="lede">${t('ruSub')}</p>
      <ol>${t('ruList').map(x=>`<li>${x}</li>`).join('')}</ol>
      <div class="row"><button class="btn" type="button" id="mHow">${t('scEx')}</button></div>
      <h3>${t('fairH')}</h3>
      <p class="note">${t('fairP')}</p>
      <h3>${t('balH')}</h3>
      <p class="note">${t('balP')}</p>
      <label class="switch" for="balSw"><span>${t('balSw')}</span><input type="checkbox" id="balSw" ${balancedOn?'checked':''}></label>
      <h3>${t('tmH')}</h3>
      <p class="note">${t('tmP')}</p>
      <label class="switch" for="tmSw"><span>${t('tmSw')}</span><input type="checkbox" id="tmSw" ${timerOn?'checked':''}></label>
      <div class="row"><button class="btn primary" type="button" id="mClose">${t('gotIt')}</button></div></div>`);
    wireLang(showRules);
    $('mClose').onclick=closeModal; $('mHow').onclick=()=>showScoring();
    $('tmSw').onchange=e=>{ timerOn=e.target.checked; try{ localStorage.setItem('cb-timer', timerOn?'on':'off'); }catch(err){} if (!timerOn){ T.byModal=false; stopTimer(); } toast(timerOn?t('timerOn'):t('timerOff')); };
    $('balSw').onchange=e=>{ balancedOn=e.target.checked; try{ localStorage.setItem('cb-balanced', balancedOn?'on':'off'); }catch(err){} toast(balancedOn?t('balOn'):t('balOff')); };
  }
  $('btnRules').onclick=showRules;
  paintSnd(); $('btnSnd').onclick=()=>{ SFX.toggle(); paintSnd(); toast(SFX.on?t('sndOn'):t('sndOff')); };
  $('btnScores').onclick=()=>showScores(false);
  $('dealCode').onclick=()=>toast(t('fairToast'));
  window.addEventListener('resize',()=>renderHand());

  paintStatic();
  newGame();
})();
</script>

</body></html>
